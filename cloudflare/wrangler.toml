name = "dynaflux-discord-worker"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

[vars]
# Default: Ethereum Sepolia Testnet (Free Faucets without 0.001 ETH requirement)
# (For Base Sepolia, set CHAIN_ID = "84532", RPC_URL = "https://sepolia.base.org", EXPLORER_URL = "https://sepolia.basescan.org")
CHAIN_ID = "11155111"
RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com"
EXPLORER_URL = "https://sepolia.etherscan.io"
# Set after deploying contracts/DynaFluxToken.sol
CONTRACT_ADDRESS = "0x5518963068663df44026d589800218dd4647be21"

# Secrets to set via `npx wrangler secret put <NAME>`:
# - DISCORD_PUBLIC_KEY       (from Discord Developer Portal -> General Information)
# - DISCORD_APP_ID           (from Discord Developer Portal -> General Information)
# - RELAYER_PRIVATE_KEY      (0x... private key of the gas-sponsoring testnet wallet)
