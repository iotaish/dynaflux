[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "dynaflux"
version = "0.9.0"
description = "Autonomous Verifiable Thermostatic Cryptocurrency & Serverless Discord Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.4.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.3",
    "typer>=0.12.0",
]

[project.scripts]
dynaflux = "dynaflux.cli:app"
dynaflux-bot = "dynaflux.bot:main"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
