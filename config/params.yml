# DynaFlux (DFX) Protocol Parameters (Single Source of Truth)
# Tuned for active community & Discord economies:
# - 7-day rapid velocity cooling cycle (`decay_to_tenth_days: 7.0`)
# - 28-day long-term baseline memory (`early_lag_multiplier: 4.0`)
# - Two-stage thermostat (`const: 0.90`, `gen_dis_rate: 1.8` -> `c_gen = 1.62`)
# - 1,000 DFX minimum baseline capacity (`min_early_dfx: 1000.0`)
#
# Run `uv run dynaflux freeze` to compile and bake these values into `contracts/DynaFluxToken.sol`.

token:
  name: "DynaFlux"
  symbol: "DFX"

thermostat:
  # Base transfer coefficient c (controls transfer burn curve and transfer cutoff at early / c)
  const: 0.90
  # Mint penalty multiplier (c_gen = const * gen_dis_rate = 1.62; minting halts at ~61.7% of early)
  gen_dis_rate: 1.8
  # Number of days over which `late` velocity decays to 0.1x (1/10)
  decay_to_tenth_days: 7.0
  # Lag multiplier for `early` reference decay relative to `late` (7d * 4 = 28d reference window)
  early_lag_multiplier: 4.0
  # Built-in minimum baseline for `early` in DFX (prevents deflationary deadlock after idle periods)
  min_early_dfx: 1000.0

pow:
  # Lightweight theoretical Proof-of-Work leading zero bits (8 bits = avg 256 hashes, <1ms on mobile/Worker)
  difficulty_bits: 8
